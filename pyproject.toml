[project]
name = "langgraph-checkpoint-cosmos"
version = "0.1.1"
description = "LangGraph checkpoint saver for Azure Cosmos DB"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ramacharan Reddy Kasireddy", email = "ramacharanreddykasireddy@gmail.com" }
]
keywords = [
    "langgraph",
    "checkpoint",
    "cosmos",
    "cosmosdb",
    "azure",
    "persistence",
    "state-management",
    "workflow",
    "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "langgraph-checkpoint>=3,<5.0.0",
    "langgraph",
    "azure-cosmos>=4.6.0",
    "azure-identity>=1.15.0",
    "aiohttp>=3.9.0",
]

[project.urls]
Homepage = "https://github.com/LangModule/checkpoint-cosmos"
Repository = "https://github.com/LangModule/checkpoint-cosmos"
Documentation = "https://github.com/LangModule/checkpoint-cosmos#readme"
Issues = "https://github.com/LangModule/checkpoint-cosmos/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_checkpoint_cosmos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
